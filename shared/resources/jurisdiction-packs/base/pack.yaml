# ============================================================================
# base/pack.yaml —— 通用层知识包元数据
# ----------------------------------------------------------------------------
# 三层知识结构（蓝本第六节）：custom > jurisdiction > base
#   base         通用风控与行业基本规则（与法域无关，任何合同都适用）
#   jurisdiction 国家/地区制度约束（法条、强制性规定）
#   custom       企业自定义规则（模板、审批习惯、内部红线）
#
# base 层的定位：它回答「一份商业合同通常应该有什么、数值通常在什么区间」，
# 不回答「按某国法律是否有效」。后者是 jurisdiction 层的职责。
# base 层的结论**永远不能单独构成合规结论**——没加载法域包时只能输出
# 「通用风控视角的观察」，不能写「合规无异常」（见样本 TC-004）。
# ============================================================================

meta:
  # 包标识。与 contract.yaml 的 version_matrix.jurisdiction_pack_version 配套使用。
  pack_id: base
  # 包版本号。格式 <pack_id>-v<n>。规则数值或判据变化即递增。
  pack_version: base-v1
  # 知识内容的基准日期，对应蓝本第八节版本矩阵的 knowledge_base_version 维度。
  knowledge_base_version: '2026-08-31'
  # 优先级数值。数字越大越优先，合并时高优先级覆盖低优先级同 id 规则。
  precedence: 10
  # 兼容的本体版本。不匹配时输出数据对齐建议（蓝本第八节）。
  compatible_ontology: [onto-v1]
  updated_at: '2026-08-31'
  maintainer: 合同审查智能体团队
  language: zh-CN

# ---------------------------------------------------------------------------
# 适用范围
# ---------------------------------------------------------------------------
applies_to:
  # 本包适用的合同类型。unlisted 类型仍可使用，但须在报告中标注「类型未登记」。
  contract_types:
    - 服务协议 / MSA
    - 采购与供应合同
    - 保密协议 / NDA
    - 软件许可与订阅协议
    - 数据处理协议 / DPA
    - 框架协议与订单
  # 本包**不**适用的场景，遇到时必须提示需要专门知识包而不是硬套。
  not_applicable_to:
    - 劳动合同（须加载对应法域包的劳动章节）
    - 不动产交易、建设工程施工
    - 金融衍生品、并购交易文件
    - 消费者格式合同（涉及消费者保护强制性规定）
  jurisdiction_neutral: true   # 本层不含任何国别法条

# ---------------------------------------------------------------------------
# 包内文件
# ---------------------------------------------------------------------------
files:
  missing-clauses.yaml:
    description: 蓝本第十节的 9 项关键缺失条款检查，含严重度三档与影响三类
    consumed_by: [risk-scanner, review-reporter]
  market-benchmarks.yaml:
    description: 蓝本第十一节的 4 条市场标尺，含偏差信号判定阈值
    consumed_by: [risk-scanner, review-reporter]

# ---------------------------------------------------------------------------
# 层间合并语义（三层共用，各层 pack.yaml 均复述以便单独阅读时不丢上下文）
# ---------------------------------------------------------------------------
merge_semantics:
  priority_order: custom > jurisdiction > base
  merge_key: 规则条目的 id（跨层同 id 视为同一条规则的不同层版本）
  override_declaration: 高层覆盖低层时，高层条目必须写 overrides 字段列出被覆盖的 id，否则视为新增而非覆盖
  mandatory_floor: |
    custom 层不得放宽 jurisdiction 层标记 mandatory: true 的规则。
    企业红线可以比法律更严，不能比法律更松。冲突时以 jurisdiction 层为准并输出冲突提示。
    （见 rules.md#R-050）
  unresolved_conflict: 同优先级两条规则判定相反时，取更保守者并记 failure_mark，禁止 Agent 自行择一

# ---------------------------------------------------------------------------
# 变更记录
# ---------------------------------------------------------------------------
changelog:
  - version: base-v1
    date: '2026-08-31'
    changes: 初始建立：9 项缺失条款检查 + 4 条市场标尺
    rationale: 蓝本第十节与第十一节
