# ============================================================================
# jurisdiction-cn/pack.yaml —— 中国法知识包元数据
# ----------------------------------------------------------------------------
# 优先级：custom > jurisdiction > base。本包处于中间层。
# 本包的 mandatory: true 规则构成「下限」——custom 层可以更严，不得更松
# （见 base/pack.yaml#merge_semantics.mandatory_floor 与 rules.md#R-050）。
#
# 【引用法条的纪律】本包中每条规则都标注 confidence。
# 标注 needs_human_confirmation 的，Agent 在报告中必须原样写出「需人工确认」，
# 禁止为了让结论看起来完整而补一个编号（rules.md#R-061 / 样本 TC-004）。
# 法律会修订，条文序号会变；把不确定伪装成确定，比不给结论更糟。
# ============================================================================

meta:
  pack_id: jurisdiction-cn
  # 版本号格式 cn-v<n>，对应蓝本第八节 version_matrix.jurisdiction_pack_version。
  # 与法域线索不一致时**阻断**（contract.yaml#INV-008）。
  pack_version: cn-v1
  knowledge_base_version: '2026-08-31'
  precedence: 20                     # 高于 base(10)，低于 custom(30)
  compatible_ontology: [onto-v1]
  requires_pack: [base]              # 本包是增量，必须与 base 层合并后使用
  updated_at: '2026-08-31'
  maintainer: 合同审查智能体团队
  language: zh-CN

# ---------------------------------------------------------------------------
# 法域标识与匹配线索
# ---------------------------------------------------------------------------
jurisdiction:
  code: CN
  name: 中华人民共和国（不含香港特别行政区、澳门特别行政区与台湾地区）
  legal_system: 大陆法系 / 成文法
  # 出现以下线索之一即应加载本包；应加载而未加载时阻断（rules.md#R-021）。
  detection_clues:
    governing_law_texts:
      - 中华人民共和国法律
      - 中国法律
      - 中国大陆法律
      - PRC law
      - laws of the People's Republic of China
    forum_texts: [中国国际经济贸易仲裁委员会, 贸仲, CIETAC, 北京仲裁委员会, 上海国际仲裁中心, 人民法院]
    data_regimes: [个人信息保护法, 数据安全法, 网络安全法, PIPL]
    party_domicile_hints: [中国境内注册, 统一社会信用代码]
    # ⑤ 援引的实体法名称 —— 合同正文引用了只可能属于本法域的成文法。
    # 真实合同（尤其是政府采购、建设工程这类有固定模板的）常常**没有**准据法条款，
    # 却在开篇写「根据《中华人民共和国XXX法》…及有关法律规定」。
    # 只认 `governing_law_texts` 会把这类合同判成法域待确认，整条法域链就此断掉。
    cited_statute_texts:
      # 形式判据：`《中华人民共和国` + `法》` 这个构造本身就锁定中国法域，
      # 不需要逐部枚举。下面列出的是审查中最常撞见的，用于提高检索命中率。
      - 中华人民共和国政府采购法
      - 中华人民共和国招标投标法
      - 中华人民共和国民法典
      - 中华人民共和国劳动合同法
      - 中华人民共和国个人信息保护法
      - 中华人民共和国电子签名法
      - 中华人民共和国仲裁法
      - 中华人民共和国民事诉讼法
      - 中华人民共和国反不正当竞争法
      # ⚠️ 已废止的中国法**同样是本法域的线索**——援引《合同法》说明当事人
      # 意图适用中国法，只是引错了版本。「指向哪个法域」与「这部法还有没有效」
      # 是两个独立判断，不得互相抵消：法域照推定，失效照报风险。
      - 中华人民共和国合同法          # 2021-01-01 已废止，被民法典取代
      - 中华人民共和国担保法          # 已废止
      - 中华人民共和国物权法          # 已废止
    cited_statute_exclusions:
      # 这些援引**不**指向单一法域，不得据以推定：
      - 联合国国际货物销售合同公约
      - 国际商会
      - INCOTERMS
      - UNIDROIT
  # 明示准据法为其他法域时，即使当事方在中国境内也不应把本包作为准据法依据；
  # 但涉及中国强制性规定（如数据出境、劳动）时仍须加载本包做强制性规定检查。
  overriding_mandatory_note: 中国法的强制性规定不因当事人选择外国法而当然排除，涉及境内劳动关系与境内数据处理时须一并检查

# ---------------------------------------------------------------------------
# 适用范围与不适用范围
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 团队服务范围（**唯一**服务法域）
# ---------------------------------------------------------------------------
service_scope:
  jurisdiction: 中国大陆
  is_sole_supported_jurisdiction: true
  excluded:
    - 香港、澳门、台湾地区 —— 法律体系不同，不是「中国法的地方变体」
    - 一切境外法域（美国各州、新加坡、欧盟等）
  on_out_of_scope: |
    识别到合同指向非中国大陆法域时，**不出任何实体合规结论**，
    输出「该合同法域为 X，不在本团队服务范围」并终止法域审计。
    jurisdiction-us 包仅用于**认出**这种情况，不用于给结论——见该包的 pack.yaml。
    ⚠️ 宁可明确拒绝，也不要给一份没有法域依据、却看起来像模像样的报告。
  temporal_scope: |
    法条全文库覆盖的是各法的**特定版本**，不是全部历史版本。
    合同签署日落在本库版本区间之外时同样报未覆盖，见 statutes/temporal.yaml。

applies_to:
  contract_types: [服务协议, 采购与供应, 保密协议, 软件许可与订阅, 数据处理协议, 劳动合同, 框架协议]
  not_applicable_to:
    - 香港、澳门、台湾地区法律事项（三地法律体系不同，须单独知识包）
    - 涉外仲裁裁决承认与执行的程序细节
    - 特定受管制行业（金融、医疗、教育培训）的行业专门规定
  coverage_gap_disclosure: |
    本包 cn-v1 覆盖的是通用商事合同与劳动合同中最常见的强制性约束，
    **不是**中国法的完整检查表。未覆盖领域必须在报告中标注为「本次未检查」，
    并在覆盖矩阵中留白，不得按通过计（contract.yaml#INV-012）。

# ---------------------------------------------------------------------------
# 包内文件
# ---------------------------------------------------------------------------
files:
  rules.yaml:
    description: 中国法规则条目与法域冲突判定
    consumed_by: [jurisdiction-auditor, risk-scanner, review-reporter]

# ---------------------------------------------------------------------------
# 置信度标注约定（本包核心纪律）
# ---------------------------------------------------------------------------
confidence_levels:
  high: 规则内容与条文出处均有把握，可直接引用
  content_high_article_uncertain: 规则内容有把握，但条文序号可能因修订变化——引用时写出内容并注明「条文序号需人工确认」
  needs_human_confirmation: 规则方向可作为提示，但具体标准/阈值/适用条件须人工确认——报告中必须原样写出「需人工确认」
citation_discipline:
  - 禁止编造条文编号、司法解释文号与判例名称
  - 引用司法解释时，若不能确定现行有效版本，只描述规则内容并标注需人工确认
  - 法律修订频繁的领域（数据跨境、仲裁程序）默认按 needs_human_confirmation 处理

changelog:
  - version: cn-v1
    date: '2026-08-31'
    changes: 初始建立：劳动、违约金与定金、格式条款、争议解决、生效与签署、数据合规六类规则 + 冲突判定
