# ============================================================================
# jurisdiction-cn/statutes —— 法条全文库（「开卷考」）
# ----------------------------------------------------------------------------
# 与 rules.yaml 的分工：
#   rules.yaml  是**判据**——「试用期不得超过六个月」这类可直接比对的阈值与红线
#   statutes/   是**原文**——法条逐字文本，供报告引用与人工复核
#
# rules.yaml 现在 18 条规则全部 article_confidence: high，且每条都带
# `verified_against`（在哪个文件哪一条核实的）与 `verified_note`（核到了什么）。
# 那不是"标成 high 就完事"，是逐条 grep 出原文比对过的结果——其中 1 条条号被证伪
# 并更正（见下方仲裁法）。引用时可以直接照 verified_against 复查。
#
# 【纪律一】上游元数据不可盲信 —— 这不是个案，是系统性错误
# 本库 9 部法中 **5 部** 的 frontmatter 有明显错误：`status` 标「已废止」却带未来
# 或现行的生效日期、`title` 残留 `（current年）` 占位符。比例过半。
# 而更危险的是**条号在、内容对不上**：
#   仲裁法 2025 年修订后序号整体重排，rules.yaml 原写的第十六/十八条在本库中
#   是「仲裁机构变更登记」与「组成人员」，与仲裁协议要件毫无关系。
#   真正对应的是第二十七条（要件）与第二十九条（约定不明则无效）。
# 引用任何条文前，必须同时确认：① 条号存在 ② 内容与规则表述一致 ③ 版本与效力。
# 只做①就引用，是本库最容易犯、后果最严重的错误。
#
# 【纪律零】**本文件自身也可能出错，以全文文件为准。**
# 上面这条 coverage 里的「民法典仅到第 999 条」就是错的，写了整整一轮才被发现——
# 而且是 Agent 在检索时发现的：它读到第 5772 行的第一千二百六十条，与本索引的说法
# 对不上，按纪律记了 discrepancy 并以全文文件为准。这个处理是对的。
# 索引是导航，不是判据。索引与全文文件冲突时，**永远以全文文件为准**，
# 并把出入写进报告——就像对待 rules.yaml 一样。
#
# 【纪律二】查不到 ≠ 法无规定。本库覆盖有限（见下方 coverage / not_covered），
# 在库中检索不到时只能报「本库未覆盖，需人工确认」，**禁止**据此断言「法律未作规定」。
# 这与 rules.md#R-061 是同一条原则：把不确定伪装成确定，比不给结论更糟。
# ============================================================================

meta:
  source_repo: https://github.com/ouyangyipeng/Legalize-CN
  source_ref: history-rebuild          # 注意：默认分支不是 main
  fetched_at: '2026-09-03'
  totals: {instruments: 9, articles: 2030, bytes: 597637}
  license: |
    法律法规文本依《中华人民共和国著作权法》第五条不受著作权保护，可自由使用。
    源仓库代码部分为 MIT。
  format: |
    Markdown，YAML frontmatter + 「编→章→节→条→款→项」层级。
    条文标题为行首 H4。⚠️ 但**条号之后的形态有两种**（见 retrieval 段），
    不能假定统一为 `#### 第X条` 独占一行——那会让一半文件检索恒空。

# ---------------------------------------------------------------------------
# 入库时做的清洗（必须记录，否则无法复现）
# ---------------------------------------------------------------------------
sanitization:
  inline_heading_artifact:
    problem: |
      上游批量转换时，正文里的内联引用「本法第三十九条」被误转成了 H4 标题标记，
      形如 `……劳动者没有本法#### 第三十九条　和第四十条……`。
      不清洗的话，行首检索会把这些误当成条文起始，条数统计与切分全乱。
    rule: 只还原**行中**的 `#### 第X条`，行首的保留（那才是真正的条文标题）
    regex: 's/(?<!^)#### (第[一二三四五六七八九十百千零]+条)　?/\1/gm'
    fixed_count:
      labor-contract-law: 11      # 首批入库时清洗 11 处，现 0 残留
      others: 0                   # 其余 8 部均为 0（第二批 4 部逐一验过）

# ---------------------------------------------------------------------------
# 覆盖范围 —— Agent 检索前必读
# ---------------------------------------------------------------------------
coverage:
  # ── 民事基本法 ──────────────────────────────────────────────────────────
  - file: civil-code.md
    title: 中华人民共和国民法典
    status: 现行有效
    publish_date: '2020-05-28'
    articles: 1260
    metadata_reliable: true
    ⚠️_two_formats_in_one_file: |
      **本文件内部有两种条文格式，第 999 条是分界**：
        第 1~999 条      `#### 第X条` H4 标题（部分独立成行，部分条号+正文同行）
        第 1000~1260 条  `第X条　正文` **纯文本行，没有 H4 标记**（从第 4750 行起）
      1~1260 完整连续、**一条不缺**。

      ⚠️ 本条目此前写的是「仅到第 999 条，第 1000~1260 条缺失」——**那是错的**。
      起因是统计脚本只数 `^#### 第X条`，把"没有 H4 标记"当成了"内容不存在"。
      后果很实在：照那个说法，人格权编后半、婚姻家庭编、继承编、侵权责任编
      共 261 条会被一律报「本库未覆盖」，而内容就在文件里。
      这正是本文件 retrieval 段警告的那类错误——**区分「格式没匹配上」与
      「法条不存在」**——我自己先犯了一次。检索 1000 条以后必须用格式 C。
    key_articles:
      格式条款定义与提示说明义务: 第四百九十六条
      格式条款无效情形: 第四百九十七条
      格式条款不利解释: 第四百九十八条
      合同生效: 第五百零二条
      越权代表: 第五百零四条
      情势变更: 第五百三十三条
      违约责任: 第五百七十七条
      违约金调整: 第五百八十五条
      定金（含20%上限）: 第五百八十六条至第五百八十八条
      不可抗力: 第一百八十条、第五百九十条
      诉讼时效三年: 第一百八十八条
    supersedes: |
      frontmatter 的 predecessor_laws 明确列出本法取代了：
      婚姻法、民法通则、收养法、继承法、物权法、**合同法**、侵权责任法。
      ⚠️ 这条可直接用于判定「合同引用《中华人民共和国合同法》」为**法律引用失效**
      （民法典 2021-01-01 施行时该法废止）。真实合同里这个缺陷极其常见。

