# ============================================================================
# jurisdiction-cn/statutes —— 法条全文库（「开卷考」）
# ----------------------------------------------------------------------------
# 服务范围：**中国大陆**（不含港澳台）。境外法域不在本团队服务范围，见 pack.yaml。
#
# 与 rules.yaml 的分工：
#   rules.yaml   是**判据**——「试用期不得超过六个月」这类可直接比对的阈值与红线
#   statutes/    是**原文**——法条逐字文本，供报告引用与人工复核
#   temporal.yaml 是**版本与时间效力**——哪一版、什么时候生效、旧合同该用哪版
#
# 21 部、2876 条、914 KB。
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ 四条纪律。每一条都对应一次真实发生过的错误，不是防御性套话。            │
# └─────────────────────────────────────────────────────────────────────────┘
#
# 【纪律零】**本索引自身也可能出错，以全文文件为准。**
#   这条排第一，因为它已经救过一次场：本文件曾写「民法典仅到第 999 条，
#   第 1000~1260 条缺失」，而 Agent 检索时读到第 5772 行的第一千二百六十条，
#   与索引对不上，按纪律记了 discrepancy 并以全文为准——它是对的，索引是错的
#   （那 261 条只是没有 H4 标记，见格式 C）。
#   索引是导航，不是判据。冲突时永远以全文文件为准，并把出入写进报告。
#
# 【纪律一】上游元数据不可信，判据只能是正文。
#   frontmatter 的 `status` / `effective_date` / `title` 一概不作数：多部标
#   「已废止」却带现行生效日期，title 残留 `（current年）` 占位符。
#   更进一步：**不能假定「入库的就是现行版」**——company-law.md 就是 2018 修正版，
#   而 2023 修订版早在 2024-07-01 就施行了。
#
# 【纪律二】查不到 ≠ 法无规定。
#   本库覆盖有限（见 not_covered）。检索不到时只能报「本库未覆盖，需人工确认」，
#   **禁止**据此断言「法律未作规定」。把不确定伪装成确定，比不给结论更糟。
#   查不到时先用 retrieval 段的兼容正则复检一次——很可能只是格式没匹配上。
#
# 【纪律三】**法不溯及既往：先定合同签署日，再定适用哪一版。**
#   一份 2019 年签的合同，适用的是当时有效的法律，不是今天的现行法。
#   法律依据是《民法典时间效力若干规定》第一条（全文在 civil-code-temporal-effect.md）。
#   两个会直接把结论带错的实例：
#     · 仲裁法 2026-03-01 才施行且**条号整体重排**——2026-03-01 前的合同，
#       仲裁协议要件在第十六条，不是本库的第二十七条
#     · 合同签署日 < 2021-01-01 却引用《合同法》，那是**正确的**，不是缺陷；
#       只有 >= 2021-01-01 仍引用才是法律引用失效
#   完整规程与逐部版本区间见 **temporal.yaml**，引用任何条文前必须先过那一关。
# ============================================================================

meta:
  source_repo: https://github.com/ouyangyipeng/Legalize-CN
  source_ref: history-rebuild          # 注意：默认分支不是 main
  fetched_at: '2026-09-05'
  jurisdiction: 中国大陆（不含港澳台）
  totals: {instruments: 21, articles: 2876, bytes: 935481}
  temporal_metadata: temporal.yaml     # 版本与时间效力，引用前必读
  consistency_check: 'node check-temporal.mjs'
  license: |
    法律法规文本依《中华人民共和国著作权法》第五条不受著作权保护，可自由使用。
    源仓库代码部分为 MIT。

# ---------------------------------------------------------------------------
# 入库清洗（必须记录，否则无法复现）
# ---------------------------------------------------------------------------
sanitization:
  inline_heading_artifact:
    problem: |
      上游批量转换时，正文里的内联引用「本法第三十九条」被误转成了 H4 标题标记，
      形如 `……劳动者没有本法#### 第三十九条　和第四十条……`。
      不清洗的话，行首检索会把这些误当成条文起始，条数统计与切分全乱。
    rule: 只还原**行中**的 `#### 第X条`，行首的保留（那才是真正的条文标题）
    regex: 's/(?<!^)#### (第[一二三四五六七八九十百千零]+条)　?/\1/gm'
    fixed_count: {labor-contract-law: 11, company-law: 9, copyright-law: 5, others: 0}

# ---------------------------------------------------------------------------
