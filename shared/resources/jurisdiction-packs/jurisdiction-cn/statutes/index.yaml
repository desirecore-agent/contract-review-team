not_covered:
  # 民法典曾被误列在此（"第 1000~1260 条缺失"）—— 实际完整覆盖，见 coverage 段说明
  - 其余司法解释（源仓库 judicial/ 677 件，本库只取了仲裁法解释 1 件）
  - 行政法规与部门规章（源仓库 regulations/ 636 件；政府采购法**实施条例**亦未纳入）
  - 地方性法规（源仓库 local_regulations/ 15224 件）
  - 招标投标法、公司法、担保相关专门法（源仓库有，按需再补）
  - 境外法域（新加坡、欧盟 GDPR 等）—— 与 rules.yaml 的既有边界一致

# ---------------------------------------------------------------------------
# 检索约定
# ---------------------------------------------------------------------------
retrieval:
  # ⚠️ 库内存在**两种**条文标题格式，检索必须兼容，否则一半文件永远查不到：
  #   A. 条号独立成行        civil-code.md / pipl.md / arbitration-law-interpretation.md
  #        #### 第四百九十六条
  #        格式条款是当事人为了重复使用而预先拟定……
  #   B. 条号 + 制表符/全角空格 + 正文同行
  #        labor-contract-law.md / arbitration-law.md / e-signature-law.md
  #        civil-procedure-law.md / anti-unfair-competition-law.md / govt-procurement-law.md
  #        #### 第一条	为了保证公正、及时仲裁经济纠纷……
  #   C. **完全没有 H4 标记的纯文本行**   civil-code.md 第 1000 条起（行 4750+）
  #        第一千二百六十条　本法自2021年1月1日起施行。……同时废止。
  #      ⚠️ 只按 `#### ` 检索会漏掉民法典整整 261 条，且看起来像"法条不存在"。
  #
  # 用 `^#### 第X条$` 精确锚定在 B 类文件上恒为空，Agent 会据此误报「法无规定」。
  # 正确写法是允许条号后接分隔符或行尾：
  # 同时覆盖 A/B/C 三种格式：`#### ` 前缀可有可无
  exact_article: 'grep -nE "^(#### )?第X条([ 　\t]|$)" <file>'
  exact_article_with_body: 'grep -A 3 -E "^(#### )?第X条([ 　\t]|$)" <file>'
  ⚠️_civil_code_1000plus: |
    民法典第 1000 条以后只能用上面这个带 `(#### )?` 的式子。
    用 `^#### 第一千二百六十条` 检索结果为空，但那条就在第 5772 行。
  keyword: 'grep -n "关键词" <file>  然后回溯最近的 ^#### 第 定位所属条文'
  locate_article_of_line: |
    关键词命中行不一定是条首（B 类文件的条文常有多款）。定位所属条号：
      awk -v n=<行号> 'NR<=n && /^#### 第/{last=$0} END{print last}' <file>
  ⚠️_note: |
    查不到时先换用上面的兼容正则复检一次，确认确实不在库中，再报「本库未覆盖」。
    区分「格式没匹配上」与「法条不存在」是本库能否被信任的前提。
  citation_format: |
    报告中引用格式：《法律全称》第X条 + 逐字原文引用 + 检索命令或文件行号。
    引用前必须**在本库中实际检索到**，不得凭记忆写条号——这正是引入本库要解决的问题。
    与 rules.yaml 记载不一致时，**以本库原文为准**，并在报告中明确披露这处出入。
