# ---------------------------------------------------------------------------
# 未覆盖 —— 明确列出，避免误以为「查不到 = 不存在」
# ---------------------------------------------------------------------------
not_covered:
  - 任何法律的**历史版本全文**。上游只有刑法提供了 1979 年版，其余一律只有最新版
    ——这是 temporal.yaml 整套规程存在的原因：判得出该用哪一版，但拿不出那一版原文
  - 行政法规与部门规章（政府采购法**实施条例**、招标投标法实施条例均不在库）
  - 其余司法解释（源仓库 judicial/ 677 件，本库取了 6 件）
  - 地方性法规（源仓库 15224 件）
  - 刑法及刑事司法解释（合同诈骗等刑事判断一律报未覆盖）
  - 税法、海关、外汇、行业监管专门规定
  - 港澳台及境外法域 —— **不在本团队服务范围**，见 pack.yaml#scope

# ---------------------------------------------------------------------------
# 检索约定
# ---------------------------------------------------------------------------
retrieval:
  # ⚠️ 库内有**三种**条文标题格式，检索必须同时兼容，否则整部法查不到：
  #   A. `#### 第X条` 独立成行        civil-code(1~999) / pipl / 多数司法解释
  #   B. `#### 第X条` + 制表符/全角空格 + 正文同行
  #        labor-contract-law / arbitration-law / civil-procedure-law /
  #        govt-procurement-law / anti-unfair-competition-law / e-signature-law …
  #   C. **没有 `#### ` 标记的纯文本行**   `第X条　正文`
  #        civil-code 第 1000~1260 条（行 4750+）、**data-security-law 全部 55 条**、
  #        security-system-interpretation 与 civil-code-temporal-effect 各 1 条
  #      ⇒ 只按 `^#### ` 检索：民法典漏 261 条、**数据安全法整部漏光**，
  #        而表现出来就是「本库未覆盖」——把格式问题伪装成了法条不存在。
  #
  # 统一用下面这个式子，`#### ` 前缀可有可无：
  exact_article: 'grep -nE "^(#### )?第X条([ 　\t]|$)" <file>'
  exact_article_with_body: 'grep -A 3 -E "^(#### )?第X条([ 　\t]|$)" <file>'
  keyword: 'grep -n "关键词" <file>  然后回溯最近的条首'
  locate_article_of_line: |
    关键词命中行常常不是条首（B/C 类的条文多有数款）。定位所属条号：
      awk -v n=<行号> 'NR<=n && /^(#### )?第[一二三四五六七八九十百千零]+条/{last=$0} END{print last}' <file>
  ⚠️_note: |
    查不到时先换上面的兼容正则复检一次，确认确实不在库中，再报「本库未覆盖」。
    区分「格式没匹配上」与「法条不存在」是本库能否被信任的前提。
  citation_format: |
    报告中引用格式：《法律全称》(版本) 第X条 + 逐字原文摘录 + 文件行号或检索命令。
    三个前置条件，缺一不可：
      1. 在本库中**实际检索到**（不得凭记忆写条号）
      2. 通过 temporal.yaml 的版本区间校验（合同签署日落在该版本有效期内）
      3. 与 rules.yaml 记载不一致时，**以本库原文为准**并在报告中披露这处出入
