# ============================================================================
# statutes/temporal.yaml —— 法的时间效力元数据
# ----------------------------------------------------------------------------
# 【这个文件要解决的问题】
# 「03 年的案子对应 03 年的刑法」——法不溯及既往。合同审查里同理：一份 2019 年签的
# 合同，适用的是**当时**有效的法律，不是今天的现行法。
#
# 举两个本库里真实存在、且会直接把结论带错的例子：
#
#   仲裁法：2025-09-12 修订、2026-03-01 施行。条号**整体重排**。
#     2026-03-01 之后签的合同 → 仲裁协议要件在第二十七条
#     2026-03-01 之前签的合同 → 在第十六条
#     拿现行版条号去套旧合同，条号和内容全错，而报告看起来一样专业。
#
#   公司法：本库收录的是 **2018 修正版**（218 条），而 2023-12-29 修订版
#     （266 条）已于 2024-07-01 施行。⇒ 2024-07-01 之后的合同，本库的公司法
#     **根本不能用**；而 2024-07-01 之前的合同，本库这一版正是当时有效的。
#
# 【法律依据】不是拍脑袋定的规则：
#   《最高人民法院关于适用〈中华人民共和国民法典〉时间效力的若干规定》第一条：
#     「民法典施行后的法律事实引起的民事纠纷案件，适用民法典的规定。
#      民法典施行前的法律事实引起的民事纠纷案件，**适用当时的法律、司法解释的规定**……
#      民法典施行前的法律事实**持续至**民法典施行后的，适用民法典的规定。」
#   全文见 civil-code-temporal-effect.md，第三款的「持续性法律事实」尤其要注意——
#   履行期跨越法律更替日的合同，不是简单按签署日一刀切。
#
# 【数据来源与可信度】
#   history / first_effective  ← 来自法律**正文**（开头括号的沿革串、附则的施行条款）。
#                                 这是法律文本自身的一部分，权威。
#   in_library                 ← 由条文数、标题年份标注、特征条文交叉判定，判据写在各条目里。
#   applicable_from            ← **只填能证实的**。法律附则写的永远是**初版**施行日；
#                                 修正版的施行日在「修正决定」里，而那些文件不在本库。
#                                 证实不了的一律 `unknown_needs_human`，**不得由通过日推断**
#                                 ——通过与施行常隔数月，跨那段区间的合同就会选错版本。
#
#   ⚠️ 上游 frontmatter 的 `status` / `effective_date` / `title` 一概不作数据源：
#      21 部里多部标「已废止」却带现行生效日期、title 残留 `（current年）` 占位符。
#      判据只能是正文。
# ============================================================================

meta:
  generated_at: '2026-09-05'
  legal_basis: statutes/civil-code-temporal-effect.md
  jurisdiction: 中国大陆（不含港澳台）

# ---------------------------------------------------------------------------
# 使用规程 —— jurisdiction-auditor 必须按此判定，不得跳步
# ---------------------------------------------------------------------------
procedure:
  step_1_anchor: |
    先确定**合同签署日**（contract-intake 的四大冻结之一已冻结该日期）。
    签署日不明 ⇒ 不得选定任何版本，报「签署日未冻结，无法判定适用法律版本」。
  step_2_pick_version: |
    对每一部要引用的法：拿签署日与本文件的 `applicable_from` / `applicable_until` 比对。
    命中本库收录版本的有效区间 ⇒ 可引用。
  step_3_out_of_range: |
    签署日**不在**本库收录版本的有效区间内 ⇒ **禁止引用本库条文**，
    报「本库收录的是 X 版（有效期 A~B），该合同签于 C，需人工确认当时文本」。
    ⚠️ 这是最危险的失败模式：拿现行版条号去套旧合同，看起来最专业，实际全错。
  step_4_continuing_facts: |
    履行期**跨越**法律更替日的（如 2020 年签、2022 年仍在履行），按时间效力规定
    第一条第三款属「持续性法律事实」，原则上适用新法，但必须显式披露该判断，
    并触发人工确认——这一步不是机械比日期能定的。
  step_5_unknown: |
    `applicable_from: unknown_needs_human` 的条目，**不得假定本库版本适用于任何日期**。
    引用前必须由人工确认该版本的施行日。

