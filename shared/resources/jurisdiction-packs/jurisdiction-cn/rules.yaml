conflicts:

  - id: cn-conflict-dual-governing-law
    title: 准据法双重声明
    trigger: 存在两条及以上 declaration_type = governing_law 的 governed_by 边，且指向不同法域
    nature: 互斥
    severity: severe
    verdict: 准据法只能有一个。两条并列的准据法条款构成实质冲突，必须在签署前统一
    action: 关键修改后继续；触发 HG-02
    output_requirements: [两条声明各自的条款号与页码, 各自指向的法域, 冲突性质说明]

  - id: cn-conflict-pipl-gdpr-parallel
    title: 中国法与 GDPR 并列适用
    trigger: governing_law 指向中国法，同时存在 data_regime = GDPR 的 governed_by 边
    nature: 需协调（非天然互斥）
    severity: important
    verdict: |
      两者并非天然互斥——GDPR 可以作为特定事项的 carve_out 适用。但必须判定三点：
        ① GDPR 的适用范围是否被明确界定为「就欧盟数据主体的个人数据处理」这类闭合表述
        ② 是否存在欧盟数据主体（若不存在，GDPR 条款是无适用对象的空条款，应提示删除或说明保留原因）
        ③ 是否同时满足中国法项下的数据出境要求（cn-personal-info-cross-border）
      三点中任一为否或无法判定，输出 unknown 并进 HG-02，禁止择一默认。
    action: 进入谈判项；触发 HG-02
    blueprint_ref: 测试语料 C05 场景 / 样本 TC-004
    output_requirements:
      - 两条声明的条款号与页码
      - 范围是否闭合的判定与依据
      - 两制度义务优先级是否约定
      - 中国法出境路径是否落地条款

  - id: cn-conflict-arbitration-and-litigation
    title: 仲裁与诉讼并存
    trigger: 同一文档同时存在指向仲裁机构与人民法院的 dispute_forum 声明
    nature: 互斥
    severity: severe
    verdict: 参见 cn-arbitration-or-litigation-conflict，须二者择一
    action: 关键修改后继续；触发 HG-02

  - id: cn-conflict-foreign-law-with-domestic-mandatory
    title: 选择外国法但涉及中国强制性规定
    trigger: governing_law 指向境外法域，同时合同涉及中国境内劳动关系、境内个人信息处理或其他强制性规定事项
    nature: 需协调
    severity: important
    verdict: 中国法的强制性规定不因当事人选择外国法而当然被排除；须单独检查这些事项是否符合中国法
    action: 需人工确认；同时加载本包做强制性规定检查，不得因准据法为外国法而跳过
    note: 纯国内合同（无涉外因素）选择外国法的效力存在争议，需人工确认

  - id: cn-conflict-bilingual-no-prevailing
    title: 中英文双语无优先语言约定
    trigger: relations.yaml#DC-009 命中
    nature: 需协调
    severity: important
    verdict: 双语文本不一致时无解释规则；须约定优先语言，或逐项核对关键数值
    action: 进入谈判项；同时输出两版本关键数值（金额、期限、责任上限）的比对结果

# ---------------------------------------------------------------------------
# 八、本包已知覆盖缺口（必须在报告中如实披露）
# ---------------------------------------------------------------------------
known_gaps:
  - 行业专门监管（金融、医疗、教育培训、汽车、food 等）的特别规定未覆盖
  - 反垄断相关条款（纵向价格限制、独家交易）未覆盖
  - 出口管制、两用物项与制裁合规未覆盖
  - 税务条款（增值税、代扣代缴）未覆盖
  - 知识产权权属与职务成果的细化规则未覆盖
  - 建设工程、不动产、并购交易文件未覆盖
  - 香港、澳门、台湾地区法律未覆盖
gap_policy: 命中已知缺口领域时，相关检查项在覆盖矩阵中留白（status = blank）并写明「本包未覆盖」，禁止按通过计
