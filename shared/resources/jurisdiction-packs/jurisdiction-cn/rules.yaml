# ============================================================================
# jurisdiction-cn/rules.yaml —— 中国法规则集
# ----------------------------------------------------------------------------
# 每条规则的 confidence 字段是本文件最重要的字段，取值见 pack.yaml#confidence_levels。
# Agent 在报告中引用规则时，必须把 confidence 一并转述：
#   high                            → 可直接引用条文
#   content_high_article_uncertain  → 写内容，条文序号注明「需人工确认」
#   needs_human_confirmation        → 原样写出「需人工确认」，禁止补编号凑完整
# ============================================================================

meta:
  pack_id: jurisdiction-cn
  pack_version: cn-v2
  knowledge_base_version: '2026-09-05'
  updated_at: '2026-09-05'
  jurisdiction: 中国大陆（不含港澳台）

# ---------------------------------------------------------------------------
# 时间效力政策（全局，先于任何规则生效）
# ---------------------------------------------------------------------------
temporal_policy:
  principle: |
    法不溯及既往。本文件的每条规则都锚定在**某一版**法律上，而合同适用的是
    **签署时**有效的那一版。引用任何条号之前，先过 statutes/temporal.yaml 的
    版本区间校验。
  legal_basis: |
    《最高人民法院关于适用〈中华人民共和国民法典〉时间效力的若干规定》第一条：
    民法典施行前的法律事实引起的民事纠纷案件，适用当时的法律、司法解释的规定；
    施行前的法律事实**持续至**施行后的，适用民法典。
    全文见 statutes/civil-code-temporal-effect.md。
  procedure:
    - 先取合同签署日（contract-intake 已冻结）；签署日不明则不得选定任何版本
    - 规则带 article_by_version 的，按签署日挑对应版本的条号
    - >-
      挑中的版本**不在本库**（in_library 为 false）⇒ 只陈述规则方向，
      **禁止写条号**，报「本库无该版本全文，需人工确认当时条文」
    - 履行期跨越法律更替日的，按时间效力规定第一条第三款处理并触发人工确认
  ⚠️_most_common_error: |
    拿现行版条号去套旧合同。报告看起来一样专业，条号却指向完全不同的内容——
    仲裁法 2026-03-01 前后就是这样（见 cn-arbitration-agreement-validity）。

# ---------------------------------------------------------------------------
# 民法典系列规则的共同时间边界
# ---------------------------------------------------------------------------
# 下列规则的 legal_basis 指向《民法典》，而民法典 **2021-01-01** 才施行：
#   cn-liquidated-damages-adjustment / cn-deposit-cap / cn-standard-terms-duty
#   cn-contract-effectiveness / cn-authority-and-seal / cn-force-majeure
#   cn-change-of-circumstances / cn-limitation-period
#
# ⇒ 签署日 **< 2021-01-01** 的合同适用《合同法》《担保法》《民法通则》等旧法，
#   本库**没有**这些法的全文（民法典第一千二百六十条已列明它们同时废止）。
#   此时只能陈述规则方向，禁止引用民法典条号，报「本库无当时适用法全文，需人工确认」。
#
# ⇒ 由此推出一条最容易搞反的判断：
#   合同签署日 < 2021-01-01 而引用《中华人民共和国合同法》的，是**正确**的，
#   **不得报为法律引用失效**；只有 >= 2021-01-01 仍引用《合同法》才是缺陷。
#
# ⇒ 履行期跨越 2021-01-01 的，按时间效力规定第一条第三款（持续性法律事实）
#   原则上适用民法典，但必须显式披露该判断并触发人工确认。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 一、劳动与人事
# ---------------------------------------------------------------------------
rules:

  - id: cn-labor-probation-cap
    title: 试用期法定上限
    category: labor
    mandatory: true
    confidence: high
    statement: |
      劳动合同期限三个月以上不满一年的，试用期不得超过一个月；
      一年以上不满三年的，试用期不得超过二个月；
      三年以上固定期限和无固定期限的劳动合同，试用期不得超过六个月。
      以完成一定工作任务为期限的劳动合同或者劳动合同期限不满三个月的，不得约定试用期。
      同一用人单位与同一劳动者只能约定一次试用期。
    legal_basis:
      instrument: 《中华人民共和国劳动合同法》
      article: 第十九条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/labor-contract-law.md#第十九条
      verified_note: 「三个月以上不满一年的，试用期不得超过一个月；一年以上不满三年的，不得超过二个月；三年以上固定期限和无固定期限的，不得超过六个月」；同条另有「只能约定一次试用期」
    detection:
      clause_categories: [term_duration]
      keywords: [试用期, 试用, 转正]
    verdict_rules:
      - condition: 试用期超过对应合同期限的法定上限
        conclusion: severe
        action: 关键修改后继续；超出部分的约定不具有法律效力，且可能产生赔偿责任
      - condition: 合同期限不满三个月或以完成一定工作任务为期限，却约定了试用期
        conclusion: severe
        action: 关键修改后继续
      - condition: 同一劳动者被二次约定试用期
        conclusion: severe
        action: 关键修改后继续
      - condition: 试用期在法定上限内
        conclusion: pass
    human_gate: null
    notes: 试用期工资标准另有法定下限（不低于本单位同岗位最低档工资或劳动合同约定工资的百分之八十，且不低于当地最低工资），标准细节按 needs_human_confirmation 处理

  - id: cn-labor-non-compete
    title: 竞业限制的期限、人员范围与经济补偿
    category: labor
    mandatory: true
    confidence: high
    statement: |
      竞业限制的人员限于用人单位的高级管理人员、高级技术人员和其他负有保密义务的人员。
      竞业限制期限，在解除或者终止劳动合同后，不得超过二年。
      用人单位应当在竞业限制期限内按月给予劳动者经济补偿。
    legal_basis:
      instrument: 《中华人民共和国劳动合同法》
      article: 第二十三条、第二十四条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/labor-contract-law.md#第二十三条,第二十四条
      verified_note: 23 条为保密与竞业限制的约定依据及按月给予经济补偿；24 条限定人员范围（高管、高级技术人员及其他负有保密义务的人员）并规定期限不得超过二年
    detection:
      clause_categories: [non_compete, confidentiality]
      keywords: [竞业限制, 竞业禁止, 离职后不得]
    verdict_rules:
      - condition: 竞业限制期限超过二年
        conclusion: severe
        action: 关键修改后继续；超过二年的部分不受保护
      - condition: 约定竞业限制但未约定按月支付经济补偿
        conclusion: severe
        action: 关键修改后继续；未约定补偿会显著削弱条款的可执行性
      - condition: 竞业限制适用于全体员工而未限定人员范围
        conclusion: important
        action: 进入谈判项，要求限定为负有保密义务的人员
      - condition: 期限不超过二年且约定按月补偿且限定了人员范围
        conclusion: pass
    human_gate: null
    overrides: [base/market-benchmarks.yaml#non-compete-years]
    override_reason: 中国法对竞业期限设有二年强制上限，严于市场标尺的 1-2 年参考区间；数值判定以本规则为准
    needs_human_confirmation:
      - 经济补偿的具体标准（月平均工资的一定比例、与最低工资的关系）由司法解释与地方规定确定，具体数值需人工确认
      - 违反竞业限制的违约金数额是否过高，需结合个案判断

  - id: cn-labor-employee-penalty-restriction
    title: 劳动者违约金的限制
    category: labor
    mandatory: true
    confidence: high
    statement: |
      除专项培训费用与服务期约定（第二十二条）、竞业限制约定（第二十三条）两种情形外，
      用人单位不得与劳动者约定由劳动者承担违约金。
    legal_basis:
      instrument: 《中华人民共和国劳动合同法》
      article: 第二十五条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/labor-contract-law.md#第二十五条
      verified_note: 「除本法第二十二条和第二十三条规定的情形外，用人单位不得与劳动者约定由劳动者承担违约金」——即只有服务期与竞业限制两种例外
    detection:
      clause_categories: [breach_remedy]
      keywords: [违约金, 赔偿金, 提前离职, 服务期]
    verdict_rules:
      - condition: 约定劳动者在服务期与竞业限制之外的情形承担违约金
        conclusion: severe
        action: 关键修改后继续；该约定不具有法律效力
      - condition: 仅在服务期或竞业限制情形约定违约金
        conclusion: pass
    human_gate: null

# ---------------------------------------------------------------------------
# 二、违约金、定金与损害赔偿
# ---------------------------------------------------------------------------

  - id: cn-liquidated-damages-adjustment
    title: 违约金过高可请求调减
    category: breach_remedy
    mandatory: false
    confidence: high
    statement: |
      当事人可以约定违约金及损失赔偿额的计算方法。约定的违约金低于造成的损失的，
      当事人可以请求人民法院或者仲裁机构予以增加；约定的违约金过分高于造成的损失的，
      当事人可以请求人民法院或者仲裁机构予以适当减少。
    legal_basis:
      instrument: 《中华人民共和国民法典》
      article: 第五百八十五条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/civil-code.md#第五百八十五条
      verified_note: 约定违约金；过分高于损失的，可请求人民法院或仲裁机构适当减少
    detection:
      clause_categories: [breach_remedy, liability]
      keywords: [违约金, 每日万分之, 逾期一日, 赔偿损失]
    verdict_rules:
      - condition: 约定了违约金且比例明显偏高
        conclusion: important
        action: 进入谈判项；提示对方可能主张调减，条款的实际威慑力低于字面
      - condition: 违约金条款含占位符或未约定计算基数
        conclusion: severe
        action: 阻断（contract.yaml#INV-004 / 样本 TC-003）
      - condition: 违约金要素齐备且比例常规
        conclusion: pass
    human_gate: HG-03
    needs_human_confirmation:
      - 「过分高于损失」的具体判断标准（司法实践中的比例参考）需人工确认，本包不给出数值阈值
      - 商事合同逾期付款违约金是否参照特定利率上限，需人工确认；民间借贷的利率规则不当然适用于商事合同

  - id: cn-deposit-cap
    title: 定金数额上限
    category: payment
    mandatory: true
    confidence: high
    statement: |
      定金的数额由当事人约定，但不得超过主合同标的额的百分之二十，超过部分不产生定金的效力。
      当事人既约定违约金又约定定金的，一方违约时，对方可以选择适用违约金或者定金条款，不能并用。
    legal_basis:
      instrument: 《中华人民共和国民法典》
      article: 第五百八十六条至第五百八十八条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/civil-code.md#第五百八十六条,第五百八十七条,第五百八十八条
      verified_note: 586 定金合同自实际交付时成立、数额不得超过主合同标的额的百分之二十；587 定金罚则；588 违约金与定金择一适用
    detection:
      clause_categories: [payment]
      keywords: [定金, 订金, 保证金, 双倍返还]
    verdict_rules:
      - condition: 定金超过主合同标的额百分之二十
        conclusion: important
        action: 进入谈判项；超过部分不产生定金效力
      - condition: 同时约定违约金与定金且表述为可并用
        conclusion: important
        action: 进入谈判项，明确择一适用
      - condition: 使用「订金」「保证金」等表述但意图为定金
        conclusion: important
        action: 进入谈判项，明确使用「定金」并约定罚则，否则可能不被认定为定金
      - condition: 定金比例合规且择一适用表述清晰
        conclusion: pass
    human_gate: HG-01

# ---------------------------------------------------------------------------
# 三、格式条款与合同订立
# ---------------------------------------------------------------------------

  - id: cn-standard-terms-duty
    title: 格式条款的提示说明义务与不利解释
    category: misc
    mandatory: true
    confidence: high
    statement: |
      采用格式条款订立合同的，提供格式条款的一方应当遵循公平原则确定当事人之间的权利义务，
      并采取合理的方式提示对方注意免除或者减轻其责任等与对方有重大利害关系的条款，
      按照对方的要求对该条款予以说明。未履行提示或说明义务，致使对方没有注意或理解
      与其有重大利害关系的条款的，对方可以主张该条款不成为合同的内容。
      对格式条款的理解发生争议的，应当作出不利于提供格式条款一方的解释。
    legal_basis:
      instrument: 《中华人民共和国民法典》
      article: 第四百九十六条至第四百九十八条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/civil-code.md#第四百九十六条,第四百九十七条,第四百九十八条
      verified_note: 496 定义+提示说明义务、497 无效情形、498 不利解释，三条内容与本规则逐句对应
    detection:
      clause_categories: [liability, warranty, misc]
      keywords: [本协议为格式合同, 用户协议, 服务条款, 概不负责, 免除责任]
    verdict_rules:
      - condition: 属格式条款且含免除/减轻提供方责任的内容，但无提示说明安排
        conclusion: important
        action: 进入谈判项；该条款可能不成为合同内容
      - condition: 己方为格式条款提供方且存在解释歧义
        conclusion: important
        action: 进入谈判项；歧义将作不利于己方的解释
      - condition: 非格式条款（经双方磋商）
        conclusion: pass
    human_gate: null
    notes: 判定是否属格式条款需看是否为一方预先拟定且重复使用、订立时未与对方协商；无法判定时输出 unknown

  - id: cn-contract-effectiveness
    title: 合同生效与批准登记要件
    category: misc
    mandatory: true
    confidence: high
    statement: |
      依法成立的合同，自成立时生效，但是法律另有规定或者当事人另有约定的除外。
      依照法律、行政法规的规定，合同应当办理批准等手续的，依照其规定。
    legal_basis:
      instrument: 《中华人民共和国民法典》
      article: 第五百零二条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/civil-code.md#第五百零二条
      verified_note: 「依法成立的合同，自成立时生效，但是法律另有规定或者当事人另有约定的除外」
    detection:
      clause_categories: [misc]
      keywords: [自签署之日起生效, 经批准后生效, 备案, 登记, 生效条件]
    verdict_rules:
      - condition: 约定了生效条件但未明确条件成就的认定方式
        conclusion: important
        action: 进入谈判项
      - condition: 交易类型可能需要批准/登记/备案但合同未作安排
        conclusion: important
        action: 需人工确认该交易是否属于须办理手续的类型
      - condition: 生效条款清晰且无需额外手续
        conclusion: pass
    human_gate: HG-04

  - id: cn-authority-and-seal
    title: 签署权限与印章效力
    category: misc
    mandatory: false
    confidence: high
    statement: |
      法定代表人或者负责人超越权限订立的合同，除相对人知道或者应当知道其超越权限外，
      该代表行为有效。司法实践中，判断盖章行为的效力重在盖章之人是否有代表权或代理权，
      而非印章本身的真伪。
    legal_basis:
      instrument: 《中华人民共和国民法典》
      article: 第五百零四条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/civil-code.md#第五百零四条
      verified_note: 「法定代表人或者负责人超越权限订立的合同，除相对人知道或者应当知道其超越权限外，该代表行为有效」
    detection:
      clause_categories: [misc]
      keywords: [法定代表人, 授权代表, 公章, 合同专用章, 授权委托书]
    verdict_rules:
      - condition: 签署人非法定代表人且无授权文件
        conclusion: severe
        action: 阻断；触发 HG-04（生效要件）
      - condition: 仅有个人签字无印章，或仅有印章无签署人姓名
        conclusion: important
        action: 需人工确认签署人代表权
      - condition: 法定代表人签署或附有授权委托书
        conclusion: pass
    human_gate: HG-04
    needs_human_confirmation:
      - 「看人不看章」的司法裁判口径出自最高人民法院会议纪要，具体文号与现行适用范围需人工确认

# ---------------------------------------------------------------------------
# 四、争议解决
# ---------------------------------------------------------------------------

  - id: cn-arbitration-agreement-validity
    title: 仲裁协议的有效要件
    category: dispute_resolution
    mandatory: true
    confidence: high
    statement: |
      仲裁协议应当具有请求仲裁的意思表示、仲裁事项、选定的仲裁机构三项内容。
      仲裁协议对仲裁事项或者仲裁机构没有约定或者约定不明确的，当事人可以补充协议；
      达不成补充协议的，仲裁协议无效。
    legal_basis:
      instrument: 《中华人民共和国仲裁法》
      article_by_version:
        - version: 2025 年修订版
          applicable_from: '2026-03-01'
          article: 第二十七条、第二十九条
          in_library: true
          verified_against: statutes/arbitration-law.md#第二十七条,第二十九条
          quote_27: 「仲裁协议应当具有下列内容：（一）请求仲裁的意思表示；（二）仲裁事项；（三）选定的仲裁机构。」
          quote_29: 「仲裁协议对仲裁事项或者仲裁机构没有约定或者约定不明确的，当事人可以补充协议；达不成补充协议的，仲裁协议无效。」
        - version: 2017 年修正版
          applicable_until: '2026-02-28'
          article: 第十六条、第十八条
          in_library: false
          ⚠️: |
            **本库没有这一版全文**（上游只提供最新版）。签署日在 2026-03-01 之前的
            合同适用本版，此时只能陈述规则方向，**禁止写条号**，报
            「本库无 2017 修正版全文，需人工确认当时条文」。
      article_confidence: high
      content_confidence: high
      ⚠️_renumbered: |
        **这是全库条号跨版本变动最剧烈的一条，也最容易搞错。**
        2025 修订版把序号整体重排了：

          事项            | 2017 修正版 | 2025 修订版
          仲裁协议要件    | 第十六条    | 第二十七条
          约定不明→无效   | 第十八条    | 第二十九条

        库中 2025 版的第十六条讲「仲裁机构变更登记」、第十八条讲「组成人员」。
        ⚠️ 曾经有一轮把旧条号当成「错误」直接改掉——**旧条号不是错的，是旧版本的**。
        一刀切用新条号，所有 2026-03-01 前的合同都会拿到指向完全不同内容的条号。
    detection:
      clause_categories: [dispute_resolution]
      keywords: [仲裁, 仲裁委员会, 仲裁规则, 裁决为终局]
    verdict_rules:
      - condition: 约定仲裁但未指明具体仲裁机构名称（如仅写「提交有管辖权的仲裁机构」）
        conclusion: severe
        action: 关键修改后继续；仲裁协议可能无效，届时只能诉讼
        blueprint_ref: 第十二节 争议解决机制属不可替代动作
      - condition: 仲裁机构名称不准确或已不存在
        conclusion: severe
        action: 关键修改后继续
      - condition: 仲裁机构、仲裁事项、意思表示三要素齐备
        conclusion: pass
    human_gate: HG-02
    needs_human_confirmation:
      - |
        条号已按库中 2025 修订版核实并更正（见 legal_basis.verified_note）。
        仍待人工确认的是**效力状态**：库中 frontmatter 自相矛盾（status 标「已废止」
        却带 effective_date 2026-03-01，title 残留「（current年）」占位符）。
        引用前须确认该修订版是否已生效，以及个案适用的是修订前还是修订后文本。

  - id: cn-arbitration-or-litigation-conflict
    title: 「或裁或审」条款
    category: dispute_resolution
    mandatory: true
    confidence: high
    statement: |
      当事人约定争议既可以申请仲裁也可以向人民法院起诉的（俗称「或裁或审」），
      按司法解释规则该仲裁协议原则上无效，但一方申请仲裁而另一方在规定期限内未提出异议的除外。
    legal_basis:
      instrument: 最高人民法院关于适用《中华人民共和国仲裁法》若干问题的解释
      article: 第七条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/arbitration-law-interpretation.md#第七条
      verified_note: |
        「当事人约定争议可以向仲裁机构申请仲裁也可以向人民法院起诉的，仲裁协议无效。
        但一方向仲裁机构申请仲裁，另一方未在仲裁法第二十条第二款规定期间内提出异议的除外」。
        相邻两条同样常用：第五条（约定两个以上仲裁机构）、第六条（约定「某地的仲裁
        机构」且该地仅有一个时，视为已约定）——后者意味着"某地仲裁机构"这种写法
        **不必然无效**，判断要看该地机构数量，不能一律判死。
    detection:
      clause_categories: [dispute_resolution]
      keywords: [可以向, 也可以, 仲裁或者诉讼, 任一方可选择]
    verdict_rules:
      - condition: 同时约定仲裁与诉讼两种途径且可由当事人选择
        conclusion: severe
        action: 关键修改后继续；须二者择一
      - condition: 约定分层争议解决（协商→调解→仲裁）且最终途径唯一
        conclusion: pass
    human_gate: HG-02
    notes: |
      条号已核实为最高法仲裁法解释第七条（见 legal_basis.verified_against），
      不再是「条文需人工确认」。
      ⚠️ 但**结论不能一律判无效**：同一解释第六条规定「约定由某地的仲裁机构仲裁
      且该地仅有一个仲裁机构的，该仲裁机构视为约定的仲裁机构」。
      所以「某地仲裁机构」这类写法要先看该地机构数量，不得直接套第七条判死。

  - id: cn-forum-selection
    title: 协议管辖的限制
    category: dispute_resolution
    mandatory: true
    confidence: high
    statement: |
      当事人可以书面协议选择与争议有实际联系的地点的人民法院管辖，
      但不得违反级别管辖和专属管辖的规定。
    legal_basis:
      instrument: 《中华人民共和国民事诉讼法》
      article: 第三十五条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/civil-procedure-law.md#第三十五条
      verified_note: |
        「合同或者其他财产权益纠纷的当事人可以书面协议选择被告住所地、合同履行地、
        合同签订地、原告住所地、标的物所在地等与争议有实际联系的地点的人民法院管辖，
        但不得违反本法对级别管辖和专属管辖的规定」。
        涉外协议管辖另见第二百七十七条。
    detection:
      clause_categories: [dispute_resolution]
      keywords: [管辖, 人民法院, 诉讼, 原告所在地, 被告所在地, 合同签订地]
    verdict_rules:
      - condition: 约定的管辖法院与争议无实际联系地点
        conclusion: important
        action: 需人工确认该约定是否有效
      - condition: 约定「原告所在地法院管辖」而原告不确定
        conclusion: important
        action: 进入谈判项；约定不明可能导致管辖争议
      - condition: 涉及专属管辖事项（如不动产纠纷）却另行约定管辖
        conclusion: severe
        action: 关键修改后继续
      - condition: 管辖约定具体且与争议有实际联系
        conclusion: pass
    human_gate: HG-02

