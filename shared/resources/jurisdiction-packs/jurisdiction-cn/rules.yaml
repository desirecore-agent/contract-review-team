  - id: cn-force-majeure
    title: 不可抗力的法定含义与通知义务
    category: force_majeure
    mandatory: false
    confidence: high
    statement: |
      不可抗力是不能预见、不能避免且不能克服的客观情况。因不可抗力不能履行合同的，
      根据不可抗力的影响，部分或者全部免除责任，但是法律另有规定的除外。
      当事人一方因不可抗力不能履行合同的，应当及时通知对方以减轻可能给对方造成的损失，
      并应当在合理期限内提供证明。当事人迟延履行后发生不可抗力的，不免除其违约责任。
    legal_basis:
      instrument: 《中华人民共和国民法典》
      article: 第一百八十条、第五百九十条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/civil-code.md#第一百八十条,第五百九十条
      verified_note: 180 条不可抗力免责的一般规则与定义；590 条按不可抗力影响部分或全部免除合同责任，并含及时通知与证明义务
    detection:
      clause_categories: [force_majeure]
      keywords: [不可抗力, 不能预见, 政府行为, 自然灾害]
    verdict_rules:
      - condition: 未约定通知义务与证明期限
        conclusion: important
        action: 进入谈判项
      - condition: 约定不可抗力可免除已到期付款义务
        conclusion: important
        action: 进入谈判项；此约定对收款方不利，且迟延履行后发生不可抗力不免责
      - condition: 要素齐备（界定 + 通知 + 后果）
        conclusion: pass
    human_gate: HG-03
    false_positive_guard: 不可抗力事件列举范围宽窄不构成风险结论（见 base/missing-clauses.yaml#force-majeure 与样本 TC-008）

  - id: cn-change-of-circumstances
    title: 情势变更
    category: misc
    mandatory: false
    confidence: high
    statement: |
      合同成立后，合同的基础条件发生了当事人在订立合同时无法预见的、不属于商业风险的重大变化，
      继续履行合同对于当事人一方明显不公平的，受不利影响的当事人可以与对方重新协商；
      在合理期限内协商不成的，当事人可以请求人民法院或者仲裁机构变更或者解除合同。
    legal_basis:
      instrument: 《中华人民共和国民法典》
      article: 第五百三十三条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/civil-code.md#第五百三十三条
      verified_note: 情势变更：合同基础条件发生订立时无法预见、不属于商业风险的重大变化，继续履行显失公平的，可重新协商或请求变更、解除
    detection:
      clause_categories: [misc, force_majeure]
      keywords: [情势变更, 重新协商, 显失公平]
    verdict_rules:
      - condition: 合同明确排除情势变更规则的适用
        conclusion: important
        action: 需人工确认该排除约定的效力
      - condition: 未提及
        conclusion: advisory
        action: 长期合同建议约定重新协商机制
    human_gate: null

  - id: cn-limitation-period
    title: 诉讼时效
    category: misc
    mandatory: true
    confidence: high
    statement: |
      向人民法院请求保护民事权利的诉讼时效期间为三年，法律另有规定的依照其规定。
      诉讼时效期间自权利人知道或者应当知道权利受到损害以及义务人之日起计算。
    legal_basis:
      instrument: 《中华人民共和国民法典》
      article: 第一百八十八条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/civil-code.md#第一百八十八条
      verified_note: 「向人民法院请求保护民事权利的诉讼时效期间为三年」
    detection:
      clause_categories: [misc, breach_remedy]
      keywords: [时效, 索赔期限, 应在...日内提出]
    verdict_rules:
      - condition: 约定的索赔期限显著短于三年
        conclusion: important
        action: 进入谈判项；注意约定索赔期与法定诉讼时效的关系需人工确认
      - condition: 约定延长诉讼时效期间
        conclusion: important
        action: 需人工确认；诉讼时效属法定，当事人约定延长的效力存在争议
    human_gate: null
    needs_human_confirmation:
      - 合同约定的索赔通知期与法定诉讼时效的相互关系，需人工确认

# ---------------------------------------------------------------------------
# 六、数据合规与保密
# ---------------------------------------------------------------------------

  - id: cn-personal-info-cross-border
    title: 个人信息出境的合规路径
    category: data_protection
    mandatory: true
    confidence: high
    statement: |
      个人信息处理者因业务等需要确需向中华人民共和国境外提供个人信息的，
      应当具备下列条件之一：通过国家网信部门组织的安全评估；
      按照国家网信部门的规定经专业机构进行个人信息保护认证；
      按照国家网信部门制定的标准合同与境外接收方订立合同约定双方的权利和义务。
      关键信息基础设施运营者和处理个人信息达到国家网信部门规定数量的处理者，
      应当将在境内收集和产生的个人信息在境内存储，确需向境外提供的应当通过安全评估。
    legal_basis:
      instrument: 《中华人民共和国个人信息保护法》
      article: 第三十八条、第四十条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/pipl.md#第三十八条,第四十条
      verified_note: 38 条列举跨境提供的四项前置条件；40 条为关键信息基础设施运营者的境内存储与安全评估要求
    detection:
      clause_categories: [data_protection]
      keywords: [个人信息, 数据出境, 跨境传输, 境外接收方, 标准合同, 安全评估]
    verdict_rules:
      - condition: 合同涉及个人信息出境但未约定任何合规路径
        conclusion: severe
        action: 关键修改后继续
      - condition: 约定了标准合同但未附标准合同文本或未约定备案安排
        conclusion: important
        action: 进入谈判项
      - condition: 服务涉及境外服务器/境外关联方访问但合同未识别为数据出境
        conclusion: severe
        action: 关键修改后继续；出境的识别以是否可被境外主体访问为准，不以数据是否物理传输为准
      - condition: 明确约定了合规路径与责任分配
        conclusion: pass
    human_gate: null
    needs_human_confirmation:
      - 触发安全评估的数量门槛、豁免情形与最新监管口径变动频繁，具体阈值需人工确认
      - 「重要数据」的识别标准依赖行业目录，需人工确认

  - id: cn-data-processing-agreement
    title: 委托处理个人信息的约定要求
    category: data_protection
    mandatory: true
    confidence: high
    statement: |
      个人信息处理者委托处理个人信息的，应当与受托人约定委托处理的目的、期限、处理方式、
      个人信息的种类、保护措施以及双方的权利和义务等，并对受托人的个人信息处理活动进行监督。
      受托人应当按照约定处理个人信息，不得超出约定的处理目的、处理方式等处理个人信息；
      委托合同不生效、无效、被撤销或者终止的，受托人应当返还个人信息或者予以删除，不得保留。
    legal_basis:
      instrument: 《中华人民共和国个人信息保护法》
      article: 第二十一条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/pipl.md#第二十一条
      verified_note: |
        「个人信息处理者委托处理个人信息的，应当与受托人约定委托处理的目的、期限、
        处理方式、个人信息的种类、保护措施以及双方的权利和义务等，并对受托人的
        个人信息处理活动进行监督」；同条第三款「未经个人信息处理者同意，受托人
        不得转委托他人处理个人信息」。
    detection:
      clause_categories: [data_protection]
      keywords: [委托处理, 受托方, 数据处理协议, 处理目的, 删除或返还]
    verdict_rules:
      - condition: 存在委托处理但缺少目的/期限/方式/种类/保护措施任一要素
        conclusion: severe
        action: 关键修改后继续；逐项列出缺失要素
      - condition: 未约定终止后返还或删除
        conclusion: severe
        action: 关键修改后继续
        linked_check: base/missing-clauses.yaml#data-export
      - condition: 要素齐备
        conclusion: pass
    human_gate: null

  - id: cn-trade-secret-protection
    title: 商业秘密的构成与保密条款
    category: confidentiality
    mandatory: false
    confidence: high
    statement: |
      商业秘密是指不为公众所知悉、具有商业价值并经权利人采取相应保密措施的
      技术信息、经营信息等商业信息。保密条款的可执行性取决于信息是否满足上述三要件，
      以及权利人是否实际采取了保密措施。
    legal_basis:
      instrument: 《中华人民共和国反不正当竞争法》
      article: 第十条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/anti-unfair-competition-law.md#第十条
      ⚠️_temporal: |
        本库收录的是 **2025 年第二次修订版，2025-10-15 施行**。
        ⇒ 签署日 < 2025-10-15 的合同适用 2017 修订版，商业秘密条款条号与本库不同，
          而本库**没有**那一版全文 ⇒ 只陈述规则方向，禁止写条号。
      verified_note: |
        同一条内既有定义也有侵权情形：「本法所称的商业秘密，是指不为公众所知悉、
        具有商业价值并经权利人采取相应保密措施的技术信息、经营信息等商业信息」；
        第一款四项列举侵犯行为，其中（三）为「违反保密义务……披露、使用」。
        ⚠️ **「经权利人采取相应保密措施」是构成要件**——合同里没有保密安排，
        信息就不构成商业秘密，谈不上侵权。这是审查保密条款时最实用的落点。
    detection:
      clause_categories: [confidentiality]
      keywords: [保密信息, 商业秘密, 保密义务, 保密期限]
    verdict_rules:
      - condition: 保密信息定义过宽（如「本协议项下一切信息」）且无排除项
        conclusion: important
        action: 进入谈判项；过宽定义在争议中可能整体不被支持
      - condition: 未约定保密义务期限
        conclusion: important
        action: 进入谈判项；须区分一般保密信息（有期限）与商业秘密（可约定至公开为止）
      - condition: 定义清晰、含标准排除项、期限明确
        conclusion: pass
    human_gate: null

  - id: cn-electronic-signature
    title: 电子签名的效力与不适用情形
    category: misc
    mandatory: true
    confidence: high
    statement: |
      民事活动中的合同可以约定使用电子签名、数据电文；可靠的电子签名与手写签名或者盖章
      具有同等的法律效力。但涉及婚姻、收养、继承等人身关系的文书，
      涉及停止供水、供热、供气等公用事业服务的文书，以及法律、行政法规规定不适用电子文书的
      其他情形，不适用电子签名。
    legal_basis:
      instrument: 《中华人民共和国电子签名法》
      article: 第三条、第十三条、第十四条
      article_confidence: high
      content_confidence: high
      verified_against: statutes/e-signature-law.md#第三条,第十三条,第十四条
      verified_note: |
        第三条  当事人可以约定使用或不使用电子签名；约定使用的不得仅因该形式否定其效力
        第十三条 可靠电子签名的四项条件
        第十四条 可靠的电子签名与手写签名或者盖章具有同等的法律效力
        ⚠️ 条号已核实，但**效力状态未确认**：库中 frontmatter 的 status 标「已废止」
        且 title 残留「（current年）」占位符，属上游元数据错误（见 index.yaml 纪律一）。
    detection:
      clause_categories: [misc]
      keywords: [电子签名, 电子合同, 数据电文, 在线签署, CA 证书]
    verdict_rules:
      - condition: 使用电子签名但未说明所用平台是否符合可靠电子签名要件
        conclusion: important
        action: 需人工确认；触发 HG-04
      - condition: 合同类型可能属于电子签名不适用情形
        conclusion: severe
        action: 需人工确认
      - condition: 使用可靠电子签名且合同类型无排除
        conclusion: pass
    human_gate: HG-04
    needs_human_confirmation:
      - 电子签名法排除情形的完整清单历经修正，具体项目需人工确认现行文本

