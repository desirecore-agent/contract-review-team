# ============================================================================
# custom/redlines.yaml —— 企业自定义红线（模板）
# ----------------------------------------------------------------------------
# 【全部条目默认 enabled: false】——模板不携带任何未经用户确认的判定标准。
# 用户启用一条红线 = 用户为这条判定负责。默认开启会让团队在用户不知情的情况下
# 按某个陌生标准出结论，这比不检查更糟。
#
# 每条红线的字段含义见下方 field_reference。填写时请逐字段读一遍——
# 尤其是 overrides：不写它就是新增，写了它就是覆盖，两者的行为完全不同。
# ============================================================================

meta:
  pack_id: custom
  pack_version: custom-v1
  knowledge_base_version: '2026-08-31'
  updated_at: '2026-08-31'
  entries_total: 8
  entries_enabled: 0

# ---------------------------------------------------------------------------
# 字段说明
# ---------------------------------------------------------------------------
field_reference:
  id: 红线唯一标识，前缀固定为 rl-
  title: 人类可读的名称，会出现在覆盖矩阵与报告中
  enabled: 是否启用。false 时完全不参与判定，也不出现在覆盖矩阵
  category: 对应 contract.yaml enums 的条款类别，决定被哪些条款匹配
  threshold: 判定用的数值或取值。修改这里就是修改标准，必须同时递增 pack_version
  severity: 命中后的结论等级（severe / important / advisory）
  action: 命中后的动作，须与 actions.yaml 的动作语义一致
  human_gate: 命中后是否触发某道 Human Gate（HG-01..HG-04）
  overrides: 本条覆盖的低层规则 id 列表。留空 = 新增红线，与低层规则并存取更保守者
  override_reason: 为什么本企业采用不同标准。写 overrides 时必填
  owner: 这条红线的责任人
  effective_from: 生效日期
  review_by: 下次复核日期。过期未复核的红线在报告中标注「标准可能已过时」
  rationale: 为什么有这条红线。理由缺失的红线无法被正确地例外化，也无法被安全地删除

# ---------------------------------------------------------------------------
# 红线条目
# ---------------------------------------------------------------------------
redlines:

  - id: rl-liability-cap-floor
    title: 责任上限不得低于 12 个月费用
    enabled: false
    category: liability
    threshold:
      min_months: 12
      note: 己方为客户方时的下限；己方为供应方时通常相反，启用前先确定企业主要角色
    severity: severe
    action: 先谈判
    human_gate: HG-03
    overrides: [base/market-benchmarks.yaml#liability-cap-months]
    override_reason: 示例——本企业要求以市场基准值作为硬下限，不接受 6-11 个月的中间档
    owner: 未指定
    effective_from: 未指定
    review_by: 未指定
    rationale: 示例条目。启用前请确认企业在多数合同中是客户方还是供应方，方向相反会得到相反的结论

  - id: rl-payment-term-cap
    title: 付款账期不得超过 60 天
    enabled: false
    category: payment
    threshold:
      max_days: 60
      basis: 自收到合规发票之日起算
    severity: important
    action: 进入谈判项
    human_gate: HG-01
    overrides: []
    override_reason: null
    owner: 未指定
    effective_from: 未指定
    review_by: 未指定
    rationale: 示例条目。账期红线通常还需区分币种、客户等级与预付比例，模板不预设这些维度

  - id: rl-no-unlimited-indemnity
    title: 禁止无上限赔偿义务
    enabled: false
    category: indemnity
    threshold:
      allow_uncapped_for: [第三方知识产权侵权索赔, 保密义务违反, 故意不当行为]
      note: 列表之外的赔偿义务必须受责任上限约束
    severity: severe
    action: 先谈判
    human_gate: HG-03
    overrides: []
    override_reason: null
    owner: 未指定
    effective_from: 未指定
    review_by: 未指定
    rationale: 示例条目。无上限赔偿是风险敞口不可估算的主要来源，通常只对少数标准例外开放

  - id: rl-data-export-required
    title: 必须支持终止后 90 天内标准格式数据导出
    enabled: false
    category: data_protection
    threshold:
      min_window_days: 90
      required_formats: [CSV, JSON, 行业标准格式]
      must_include_deletion_certificate: true
    severity: severe
    action: 先谈判
    human_gate: null
    overrides: [base/market-benchmarks.yaml#data-export-window-days]
    override_reason: 示例——本企业在标尺基础上追加「必须提供删除证明」这一要素
    owner: 未指定
    effective_from: 未指定
    review_by: 未指定
    rationale: 示例条目。数据锁定是切换供应商成本的最大来源

  - id: rl-dispute-forum-whitelist
    title: 争议解决机构白名单
    enabled: false
    category: dispute_resolution
    threshold:
      allowed_forums: ['（请填入本企业接受的仲裁机构或法院，例如：中国国际经济贸易仲裁委员会 / 北京仲裁委员会）']
      allow_foreign_forum: false
    severity: severe
    action: 关键修改后继续
    human_gate: HG-02
    overrides: []
    override_reason: null
    owner: 未指定
    effective_from: 未指定
    review_by: 未指定
    rationale: 示例条目。争议解决地点直接决定救济成本；白名单为空时本条不生效

  - id: rl-approval-threshold
    title: 合同金额超过阈值须上报审批
    enabled: false
    category: payment
    threshold:
      amount: 0
      currency: CNY
      approver: 未指定
      note: amount 为 0 时本条不生效；填入实际阈值后才开始判定
    severity: important
    action: 进入谈判项
    human_gate: HG-01
    overrides: []
    override_reason: null
    owner: 未指定
    effective_from: 未指定
    review_by: 未指定
    rationale: 示例条目。这条红线判定的是「流程是否走到位」，不是条款本身好坏

  - id: rl-no-auto-renewal-without-notice
    title: 禁止无通知期的自动续约
    enabled: false
    category: term_duration
    threshold:
      min_notice_days: 90
      forbid_price_increase_without_cap: true
    severity: important
    action: 进入谈判项
    human_gate: HG-01
    overrides: [base/market-benchmarks.yaml#renewal-notice-days]
    override_reason: 示例——本企业在通知期基础上追加「续约涨价必须有上限」这一要素
    owner: 未指定
    effective_from: 未指定
    review_by: 未指定
    rationale: 示例条目。自动续约叠加短通知期等于变相长期锁定

  - id: rl-template-deviation-flag
    title: 偏离本企业标准模板须标注
    enabled: false
    category: misc
    threshold:
      template_ref: '（请填入本企业标准模板的路径或标识）'
      flag_all_deviations: true
    severity: advisory
    action: 建议优化
    human_gate: null
    overrides: []
    override_reason: null
    owner: 未指定
    effective_from: 未指定
    review_by: 未指定
    rationale: 示例条目。模板偏离本身不是风险，但它是「这份合同为什么和以往不同」的入口

# ---------------------------------------------------------------------------
# 启用红线的检查清单（给用户）
# ---------------------------------------------------------------------------
enablement_checklist:
  - 确认企业在该类合同中的主要角色（客户方 / 供应方）——方向搞反会得到相反的结论
  - 填入 threshold 的真实数值，不要沿用模板里的示例值
  - 填写 owner 与 effective_from，无责任人的红线在争议时无人能解释它为什么存在
  - 判断是新增还是覆盖：需要替换低层标准时才写 overrides，并写清 override_reason
  - 确认本条没有放宽 jurisdiction 层 mandatory 规则（放宽的条目会被忽略并报冲突）
  - 递增 pack.yaml 的 pack_version，在 changelog 记录本次变更
  - 若这条红线来自一次真实的人工纠正，同时在 business-ontology/test-cases/ 增加样本（rules.md#R-052）

# ---------------------------------------------------------------------------
# 输出要求
# ---------------------------------------------------------------------------
output_requirements:
  - 已启用的红线全部进入覆盖矩阵，未命中的写 pass 并注明实际值，让「已核对」可被验证
  - 命中红线的结论必须写明：红线 id、阈值、实际值、差距
  - 结论必须携带完整四元组（条款编号 + 页码证据 + 结论等级 + 对应动作）
  - review_by 已过期的红线，在结论中追加「该标准自 <日期> 起未复核，可能已过时」
