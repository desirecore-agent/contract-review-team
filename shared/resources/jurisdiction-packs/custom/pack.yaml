# ============================================================================
# custom/pack.yaml —— 企业自定义层知识包元数据（模板，交给用户改）
# ----------------------------------------------------------------------------
# 【这是一份模板】随团队分发的是空壳与示例，不是任何真实企业的红线。
# 用户安装团队后应当：
#   1. 修改 meta.organization 与 meta.owner
#   2. 打开 redlines.yaml，逐条把 enabled 改成实际情况，填入本企业的数值
#   3. 每次调整递增 pack_version 并在 changelog 追加一行
#
# 【本层的边界】custom 层可以比法律更严，不能比法律更松。
# 试图放宽 jurisdiction 层 mandatory: true 规则的条目会被忽略，
# 并输出冲突提示（见 base/pack.yaml#merge_semantics.mandatory_floor 与 rules.md#R-050）。
#
# 【为什么它是文件而不是设置项】蓝本第十五节：规则、示例、记忆保存为
# 可查看 / 可 diff / 可回滚的文件，用户确认后生效。
# 一条红线的每次变化都应该能在 git 历史里看到是谁、什么时候、为什么改的。
# ============================================================================

meta:
  pack_id: custom
  # 每次修改 redlines.yaml 都必须递增。版本号会写进回执，用于历史任务回放。
  pack_version: custom-v1
  knowledge_base_version: '2026-08-31'
  precedence: 30                     # 最高优先级
  compatible_ontology: [onto-v1]
  requires_pack: [base]
  # ↓↓↓ 用户必填 ↓↓↓
  organization: 示例企业（请替换为贵司名称）
  owner: 法务负责人（请替换为实际负责人标识）
  approved_by: 未确认
  approved_at: 未确认
  # ↑↑↑ 用户必填 ↑↑↑
  updated_at: '2026-08-31'
  language: zh-CN

# ---------------------------------------------------------------------------
# 适用范围
# ---------------------------------------------------------------------------
applies_to:
  # 红线可以按业务线/合同类型/交易规模分别设定。scope 为 all 时对全部审查生效。
  scope: all
  contract_types: [服务协议, 采购与供应, 保密协议, 软件许可与订阅, 数据处理协议]
  # 例外范围：这里登记的是「长期例外」。个案例外走 rules.md#R-051，不写进本文件。
  standing_exceptions: []

# ---------------------------------------------------------------------------
# 包内文件
# ---------------------------------------------------------------------------
files:
  redlines.yaml:
    description: 企业红线条目。每条含开关、数值、覆盖声明、责任人与生效日期
    consumed_by: [risk-scanner, review-reporter]

# ---------------------------------------------------------------------------
# 合并语义（复述，便于单独阅读本文件时不丢上下文）
# ---------------------------------------------------------------------------
merge_semantics:
  priority_order: custom > jurisdiction > base
  override_declaration: |
    覆盖低层规则时，条目必须写 overrides 字段列出被覆盖的规则 id，
    并写 override_reason 说明为什么本企业采用不同标准。
    不写 overrides 的条目视为**新增红线**，与低层规则并存（两者都判，取更保守者）。
  mandatory_floor: |
    custom 条目试图放宽 jurisdiction 层 mandatory: true 的规则时：
      · 该条目被忽略，按 jurisdiction 层执行
      · 输出冲突提示，记入 failure_mark
      · 不阻断流程（企业可能只是配置失误），但必须在报告中显示
  disabled_entries: "enabled: false 的条目完全不参与判定，也不出现在覆盖矩阵中"

# ---------------------------------------------------------------------------
# 修改流程（强制）
# ---------------------------------------------------------------------------
change_process:
  - 修改必须经 meta.owner 确认后生效；Agent 可以起草，不得自行生效（rules.md#R-052）
  - 每次修改递增 pack_version 并在 changelog 追加一行，写明变更内容与依据
  - 影响判定结果的修改，必须同时在 business-ontology/test-cases/ 增加或更新样本
  - 回滚方式：git revert 对应提交；回滚同样要递增版本号并记录，不要静默回退

changelog:
  - version: custom-v1
    date: '2026-08-31'
    changes: "初始模板：8 条示例红线，全部 enabled: false，等待用户按实际情况启用与填值"
    rationale: 随团队分发的模板不应携带任何未经用户确认的判定标准
