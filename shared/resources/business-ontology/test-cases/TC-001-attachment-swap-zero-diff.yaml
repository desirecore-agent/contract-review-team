# ============================================================================
# TC-001 —— 历史错误样本：主合同零差异，附件被换版
# ----------------------------------------------------------------------------
# 样本的用途：它不是测试数据，是**教训的固化形式**。
# 每个样本回答三个问题：错在哪、当时为什么没发现、现在靠哪条规则拦住。
# 蓝本第十五节「一次纠正，下次自动执行」——没写成样本的纠正会重复发生。
# ============================================================================

id: TC-001
title: 主合同文本零差异，但附件三被替换为不利版本
category: must_detect           # must_detect（必须检出）/ must_not_flag（必须不误报）
severity: severe
recorded_at: '2026-08-31'
blueprint_ref: 第九节 版本对比陷阱 / 第十四节 核心质量指标

# ---------------------------------------------------------------------------
# 一、错在哪
# ---------------------------------------------------------------------------
what_went_wrong:
  summary: |
    第二轮送审时，主合同正文一字未改，系统输出「本次修订无实质性差异，可沿用上轮结论」。
    实际情况是：附件三《服务水平协议》由 v1.2 换成了 v2.0，v2.0 把可用性承诺
    从 99.9% 降到 99.0%，并新增「因第三方云服务商故障导致的中断不计入可用性统计」。
    该变更把服务方最主要的履约义务实质性削弱，但整份报告一个字都没提到它。
  observed_output: 版本对比：差异 0 项；结论：与上轮一致，建议沿用。
  actual_impact: 服务水平承诺下降 0.9 个百分点并新增免责口径，年度可用停机时间上限由约 8.8 小时放大到约 88 小时

# ---------------------------------------------------------------------------
# 二、当时为什么没发现
# ---------------------------------------------------------------------------
why_missed:
  root_cause: 附件没有自己的版本号与内容摘要，被当作主合同的从属属性而非独立对象
  failure_chain:
    - 上传时只登记了主合同的 version_label 与 content_digest
    - 附件被登记为主合同的一个字符串数组（["附件一","附件二","附件三"]），只有名称没有版本
    - 版本对比只比对主合同的 content_digest，两轮相同
    - 「差异 0」被直接翻译为「无风险变化」，未输出风险变化方向
    - 报告 Agent 读到上轮结论后复述，未回到原文重新判断
  deeper_reason: |
    「差异为 0」反而隐藏最大风险。系统默认包含附件——这个默认本身没错，
    错在默认之后不再验证附件的身份。多 Agent 系统里，每个 Agent 的输出都说得通
    （解析对了、比对对了、报告对了），放进业务链就错了：它们处理的不是同一堆对象。

# ---------------------------------------------------------------------------
# 三、现在靠哪条规则拦住
# ---------------------------------------------------------------------------
guarded_by:
  - ref: contract.yaml#INV-003
    how: 每个 contract_document（含每一份附件）的 version_label 与 content_digest 必须非 unknown，否则阻断。附件从此是一等对象
  - ref: relations.yaml#DC-004
    how: 主合同 digest 相同但任一附件 digest/version 变化或成员增删时，禁止输出「无差异」，必须点名附件替换
  - ref: contract.yaml#INV-010
    how: 版本对比输出必须携带 risk_direction；本例应判为 up
  - ref: rules.md#R-040
    how: 风险变化方向为强制字段
  - ref: rules.md#R-041
    how: risk_direction = up 时动作由「建议优化」升级为「先谈判」
  - ref: actions.yaml#declare_version_consistency
    how: 「与基线一致」成为受限动作，前置条件包含「附件集合成员与基线完全相同」且 DC-004 未命中
  - ref: rules.md#R-003
    how: 复核 Agent 不读前序结论，必须回到原文与结构化事实重新判断，切断「沿用上轮」的路径

# ---------------------------------------------------------------------------
# 四、期望行为（回归判定标准）
# ---------------------------------------------------------------------------
expected_behavior:
  must_output:
    - 明确指出「主合同正文未变，附件三由 v1.2 变更为 v2.0」，并给出两版的 content_digest 前 8 位
    - risk_direction = up
    - 针对可用性承诺下降输出结论四元组：附件三第 3.1 条（p.2）｜severe｜动作：先谈判
    - 针对新增免责口径输出独立的一条结论，不与上一条合并
    - 触发 HG-03（责任与违约分配），不自动放行
  must_not_output:
    - 差异 0 / 无实质性差异 / 可沿用上轮结论
    - 缺少 risk_direction 的版本对比结果
  scoring_expectation: 存在未解决 severe 结论时，即使总分落在 88-100，动作也须下调（rules.md#R-032 例外）

# ---------------------------------------------------------------------------
# 五、复现输入摘要
# ---------------------------------------------------------------------------
repro_input:
  baseline:
    main_contract: {object_id: doc-main-001, version_label: v1.0, content_digest: 3f2a9c1b8e4d7a60}
    attachments:
      - {object_id: doc-att-003, listed_as: 附件三, version_label: v1.2, content_digest: 91c4de08aa17b2f5}
  current:
    main_contract: {object_id: doc-main-001, version_label: v1.0, content_digest: 3f2a9c1b8e4d7a60}
    attachments:
      - {object_id: doc-att-003, listed_as: 附件三, version_label: v2.0, content_digest: 7b60fe3391ad0c42}
  note: 主合同 digest 两轮完全相同，这是本样本的关键构造
