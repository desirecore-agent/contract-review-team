# ============================================================================
# TC-007 —— 历史错误样本：复核 Agent 复述前序推理，独立复核失效
# ============================================================================

id: TC-007
title: 复核环节读到了风险识别 Agent 的推理过程，把错误一起签收
category: must_detect
severity: severe
recorded_at: '2026-08-31'
blueprint_ref: 第二节 独立复核约束 / 第十四节 多 Agent 交接规范

what_went_wrong:
  summary: |
    风险识别 Agent 把第 7.1 条的「服务费按季度预付」误读为「按季度后付」，
    并在输出中附上了推理过程（「考虑到本条位于结算章节且提到对账，
    应理解为对账后付款」）。交接时整段推理被一并传给复核 Agent。
    复核 Agent 的输出是：「经复核，第 7.1 条付款方式为后付，现金流风险较低，
    与风险识别结论一致。」——它复述了推理，没有回到原文。
    原文实为「乙方应于每季度首日前五个工作日内预付当季服务费」。
  observed_output: 经复核，与风险识别结论一致，付款方式为后付，现金流风险较低。
  actual_impact: 预付季度费用意味着资金先行且承担对方履约风险，与结论恰好相反；错误经复核后获得了额外可信度

why_missed:
  root_cause: 交接载荷传了整段对话历史，其中包含前序推理
  failure_chain:
    - 交接实现为「把上一个 Agent 的完整输出转发下去」，图省事
    - 复核 Agent 看到一段自洽的推理，倾向于验证它而不是重建它
    - 复核输出中出现「与前序结论一致」这类措辞，本身就是污染的证据，但无人检查
    - 一个 Agent 既产出又被自己的措辞影响下游，等于自检
  deeper_reason: |
    自我确认在多 Agent 系统里的形态不是「同一个模型自检」，而是
    「下游读到上游的理由后，把验证理由当成了验证事实」。
    理由越写得好，越难被推翻——所以理由根本不该进入复核输入。

guarded_by:
  - ref: rules.md#R-002
    how: 识别与复核必须由不同 Agent 执行
  - ref: rules.md#R-003
    how: 复核输入只允许原文、结构化事实、规则集、覆盖矩阵骨架；禁止推理过程、理由陈述、置信度自评、结论草稿
  - ref: rules.md#R-004
    how: 交接载荷只允许四段（交接对象编号 / 已确认事项 / 待确认项 / 本次任务范围）
  - ref: contract.yaml#conventions.scope_declaration
    how: 交接结构在本体层固化，越界字段视为非法载荷
  - ref: contract.yaml#INV-011
    how: 复核结论必须携带自己的 evidence_ref（含逐字 quote），复述无法产出逐字引文

expected_behavior:
  must_output:
    - 复核结论携带第 7.1 条的逐字原文摘录，且摘录中含「预付」二字
    - 判定为预付，并指出与前序结论不一致（不一致本身是正常产物，不是异常）
    - 触发 HG-01（付款触发与回款）
  must_not_output:
    - 与前序结论一致 / 经复核确认上述判断 / 同意风险识别 Agent 的意见
    - 任何未附逐字引文的复核结论
  detection_hint: |
    复核输出中出现「一致」「确认」「同意」加上前序 Agent 指称时，
    应作为污染信号自动拒收——这是最省力的检出方式。

repro_input:
  clause: {clause_no: '7.1', page: 11, text: 乙方应于每季度首日前五个工作日内预付当季服务费。}
  contaminated_handoff_field: prior_reasoning
  contaminated_content: 考虑到本条位于结算章节且提到对账，应理解为对账后付款
