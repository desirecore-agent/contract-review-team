# ============================================================================
# TC-008 —— 历史错误样本：标准条款被误报为高风险（误报样本）
# ============================================================================
# 本样本是 must_not_flag 类型：它检验的不是「有没有查出来」，
# 而是「有没有把没问题的东西说成有问题」。
# 误报的代价常被低估：一份 40 条高风险的报告，法务读三次之后就不再逐条读了。
# ============================================================================

id: TC-008
title: 双方对等的责任上限与惯常的不可抗力条款被判为高风险
category: must_not_flag
severity: important
recorded_at: '2026-08-31'
blueprint_ref: 第十一节 市场标尺对标 / 第十六节 衡量标准（误报数量）

what_went_wrong:
  summary: |
    一份条款质量良好的服务协议被输出 11 条高风险，其中 3 条是误报：
      ① 第 8.1 条「任何一方的累计责任不超过前 12 个月已付服务费」——
         恰好等于市场基准值，被判为「存在责任上限限制，高风险」。
      ② 第 14 条不可抗力采用行业惯常表述（含疫情、政府行为、网络攻击），
         被判为「不可抗力范围过宽，可能被滥用」，但未与任何基准比对。
      ③ 第 3.2 条「未经对方书面同意不得转让」——标准反转让条款，
         被判为「限制商业灵活性，中风险」。
    法务反馈：这份报告需要逐条排除误报，比自己读一遍合同还慢。
  observed_output: 高风险 11 条（含第 8.1 条责任上限、第 14 条不可抗力、第 3.2 条转让限制）
  actual_impact: 人工复核时间不降反升，报告可信度下降，真正的 8 条风险被淹没

why_missed:
  root_cause: 风险词库按关键词命中即报，未与市场标尺做数值/结构比对，也未区分「限制存在」与「限制不合理」
  failure_chain:
    - 词库中「责任上限」「不超过」「不得转让」被列为风险词
    - 命中即产出结论，没有「命中后再判定是否偏离基准」这一步
    - 不可抗力条款没有基准可比，Agent 用主观判断补位
    - 缺少「对等性」维度：双方对等的限制与单方限制在风险上完全不同
  deeper_reason: |
    漏检和误报是同一个问题的两面：判据不是「是否合理」，而是「是否出现关键词」。
    衡量标准里误报数量与漏检数量并列（蓝本第十六节），因为一份没人信的报告
    和一份没查出问题的报告，实际效果一样。

guarded_by:
  - ref: base/market-benchmarks.yaml#liability-cap-months
    how: 12 个月为基准值，等于或高于基准时判定为 aligned，禁止输出风险结论
  - ref: base/market-benchmarks.yaml#evaluation_protocol
    how: 词库命中只是候选，必须经数值/结构比对才能升格为结论；比对不可行时输出 unknown 并说明，而非按风险计
  - ref: base/missing-clauses.yaml#force-majeure
    how: 不可抗力判定标准是「是否约定 + 是否含通知义务与后果安排」，不含「范围是否过宽」这一无基准的主观判据
  - ref: rules.md#R-012
    how: 结论必须含结论等级与对应动作；无基准依据时无法确定等级，倒逼放弃主观判断
  - ref: rules.md#R-060
    how: 用语必须是证据显示 / 建议 / 需确认，主观风险判断无法满足证据要求

expected_behavior:
  must_not_output:
    - 第 8.1 条被列为任何等级的风险（应为 pass，实际值 12 个月 = 基准值）
    - 第 14 条被列为风险（应为 pass 或 advisory，且若为 advisory 必须给出具体缺失要素）
    - 第 3.2 条被列为风险（应为 pass；标准反转让条款，双方对等）
  must_output:
    - 第 8.1 条：pass，注明实际值 12 个月与基准值一致
    - 第 14 条：pass，注明已含通知义务（第 14.2 条）与后果安排（第 14.3 条）
    - 第 3.2 条：pass，注明限制为双方对等
  metric_note: 本样本用于统计误报数量（蓝本第十六节衡量标准），零误报是验收标准之一

repro_input:
  clauses:
    - {clause_no: '8.1', page: 13, text: 任何一方因本协议产生的累计赔偿责任不超过索赔事件发生前十二个月内对方已支付的服务费。, category: liability}
    - {clause_no: '14', page: 21, text: 因不可抗力（包括但不限于自然灾害、疫情、政府行为、战争、大规模网络攻击）导致无法履行的，受影响方应在十日内书面通知并提供证明。, category: force_majeure}
    - {clause_no: '3.2', page: 5, text: 未经对方事先书面同意，任何一方不得转让本协议项下的权利或义务。, category: assignment}
