# ---------------------------------------------------------------------------
# 失败模式分类（用于判断新样本是否覆盖了新的模式）
# ---------------------------------------------------------------------------
failure_modes:
  对象身份漂移: 几个 Agent 各自输出都说得通，但处理的不是同一个对象 —— 蓝本第十四节的核心质量指标
  不成立的对象被评分: 在占位符、未签署、页码不连续的输入上做风险判断
  知识包未加载产出的空结论: 格式完整但内容整体无效，报告表面看不出来
  存在性代替合理性: 检查回答「有没有」而不是「合不合理」
  欠账被消音: 未覆盖项被合并进通过，检查越不完整通过率越高
  自我确认: 下游读到上游的理由后，把验证理由当成验证事实
  关键词命中即结论: 词库命中未经基准比对直接升格为风险结论

# ---------------------------------------------------------------------------
# 新增样本的规范
# ---------------------------------------------------------------------------
contribution_rules:
  - 每个样本必须回答三个问题：错在哪（what_went_wrong）、当时为什么没发现（why_missed）、现在靠哪条规则拦住（guarded_by）
  - guarded_by 必须指向真实存在的规则 id；指不到规则说明这条教训还没被固化，样本不算完成
  - why_missed 必须写出 failure_chain（失败链条），只写结论等于没有诊断
  - must_not_flag 样本与 must_detect 样本同等重要：误报数量与漏检数量在衡量标准中并列（蓝本第十六节）
  - 新样本落地后，必须在本索引追加一行，并更新 meta.total_cases 与计数
  - 样本内容不得包含真实客户名称、真实金额与可识别信息；一律改写为示例值
